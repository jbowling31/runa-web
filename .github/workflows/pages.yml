# Publishes the RUNA web build to GitHub Pages.
# The game file (index.pck, ~430 MB) is over GitHub's 100 MB file limit for repos, so it is stored in 90 MB pieces
# (pck_parts/); this workflow joins them next to the web files and deploys the whole site.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir site
          cp index.* libterrain.web.release.wasm32.wasm site/
          cat pck_parts/index.pck.part* > site/index.pck
          sha256sum site/index.pck
          ls -la site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
