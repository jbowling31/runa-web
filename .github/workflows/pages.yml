# Publishes the RUNA web build to GitHub Pages.
# The game file (index.pck, ~430 MB) is over GitHub's 100 MB file limit for repos, so it lives on the latest
# Release; this workflow puts it next to the web files and deploys the whole site.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir site
          cp index.* libterrain.web.release.wasm32.wasm site/
          gh release download --repo "$GITHUB_REPOSITORY" --pattern index.pck --dir site
          ls -la site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
